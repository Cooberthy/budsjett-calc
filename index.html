<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budsjett-kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<header>
    <h1 id="title">budget calculator</h1>
</header>
<body>
    <div id="colum">
        <h1>Income</h1>
    <div id="funds">
    <input type="number" id="salary" placeholder="salary"> <br>
        <input type="number" id="other" placeholder="other">  <br>
    <button id="fundssubmit" onclick="showincome()">submit</button>
    <h1 id="showfunds"></h1>
    </div>
    <h1>Expenses</h1>
    <div id="expense">
        <input type="number" id="food" placeholder="food">
        <br>
        <input type="number" id="house" placeholder="house maintanance">
        <br>
        <input type="number" id="car" placeholder="car">
        <br>
        <input type="number" id="entertainment" placeholder="entertainment">
        <br>
        <input type="number" id="electricity" placeholder="internett and electricity">
        <br>
        <input type="number" id="loan" placeholder="loan">
        <br>
        <input type="number" id="travel" placeholder="travel">
        <br>
        <input type="number" id="kids" placeholder="kids">
        <br>
        <input type="number" id="more" placeholder="other">
        <br>
        <button onclick="expences()">submit</button>
        <h1 id="showexpenses"></h1>
    </div>
    <div id="leftover">
        <h1 id="showleftover"></h1>
    </div>
    </div>
</body>
</html>

<script src="script.js"></script>
